name: Update Core release registry
on:
  repository_dispatch:
    types: [supacharger-release]
  workflow_dispatch:
    inputs:
      tag:
        description: Published Core release tag
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: core-release-registry
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Check updater
        run: python3 -m unittest discover -s tests -v
      - name: Verify release and update record
        env:
          SC_RELEASE_TOKEN: ${{ secrets.SC_RELEASE_TOKEN }}
          RELEASE_TAG: ${{ github.event.client_payload.tag || inputs.tag }}
        run: python3 scripts/update_core_release.py
      - name: Commit verified record
        env:
          RELEASE_TAG: ${{ github.event.client_payload.tag || inputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- core/supacharger.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Register Supacharger release ${RELEASE_TAG}"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
