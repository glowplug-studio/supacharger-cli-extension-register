name: Update extension release registry
on:
  repository_dispatch:
    types: [supacharger-extension-release]
  workflow_dispatch:
    inputs:
      name:
        description: Registered extension name
        required: true
        type: string
      tag:
        description: Published extension release tag
        required: true
        type: string
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - name: Check updater
        run: python3 -m unittest discover -s tests -v
      - name: Verify release and update record
        env:
          SC_RELEASE_TOKEN: ${{ secrets.SC_RELEASE_TOKEN }}
          EXTENSION_NAME: ${{ github.event.client_payload.name || inputs.name }}
          RELEASE_TAG: ${{ github.event.client_payload.tag || inputs.tag }}
        run: python3 scripts/update_extension_release.py
      - name: Commit verified record
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- extensions/*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Register verified extension release'
          # Retry independent concurrent registry writes; conflicts fail visibly.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
